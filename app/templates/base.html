<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title> Destination X </title>

    <!-- Website Icon -->
    <link rel="icon" href="{{ url_for('static', filename='assets/images/destx-icon.png') }}" type="image/x-icon">

    <!-- Bootstrap -->
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">

    <!-- Application CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/other/css/fontawesome.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/other/css/owl.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/other/css/animate.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/base/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/base/css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/base/css/footer.css') }}">
    
    {% block css %} {% endblock%}

    <!--

    TemplateMo 580 Woox Travel

    https://templatemo.com/tm-580-woox-travel

    -->
  </head>

  <body>
    <!-- ***** Preloader Start ***** -->
    <div id="js-preloader" class="js-preloader">
      <div class="preloader-inner">
        <span class="dot"></span>
        <div class="dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <!-- ***** Preloader End ***** -->

    <!-- ***** Header Area Start ***** -->
    <header class="header-area header-sticky">
      {% include "header.html" %}
    </header>
    <!-- ***** Header Area End ***** -->
    
    {% block main %}{% endblock %}

    <footer>
      {% include "footer.html" %}
    </footer>


    <!-- Scripts -->
    <!-- Bootstrap core JavaScript -->
    <script src="{{ url_for('static', filename='vendor/jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap/js/bootstrap.min.js') }}"></script>

    <script src="{{ url_for('static', filename='assets/other/js/isotope.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/other/js/owl-carousel.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/other/js/tabs.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/other/js/popup.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/other/js/custom.js') }}"></script>

    {% block js %}   
      <!-- BASE JAVASCRIPT FUNCTIONS -->
      <script src="{{ url_for('static', filename='assets/base/js/base.js') }}"></script>
    {% endblock %}

  </body>

</html>
