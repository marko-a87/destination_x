{% extends "base.html" %}

{% block main %}

    <div class="login">
        
      <div class="login-banner">       
          
        <div class="login-slideshow-container slideshow-container">

          <div class="login-text-div">
            <h4 id="login-text"> Login to Your <em>Destination X</em> Account </h4>
          </div>

          <div class="login-form">

              <div class="">
                <form id="login-form" method="POST" action="#">

                  <div class="row">

                    <div class="col-lg-12">
                        <fieldset>
                            <label for="Email" class="form-label">Email</label>
                            <input type="text" name="Email" class="Email" placeholder="Ex. johnsmith123" autocomplete="on" required>
                        </fieldset>
                    </div>

                    <div class="col-lg-12">
                      <fieldset>
                          <label for="Password" class="form-label">Password</label>
                          <input type="password" name="Password" class="Password" required>
                      </fieldset>
                    </div>

                    <div>                        
                        <fieldset>
                            <button class="main-button"> Resume Planning </button>
                        </fieldset>
                    </div>

                  </div>

                </form>                

                <div> 
                  <h5 id="login-question-text"> 
                    Don't have an account? <em> <a href="{{ url_for('signup') }}"> Sign Up </a> </em>
                  </h5>
                </div>

              </div>

          </div>

          <div class="slide zoomFade">
            <img src="{{ url_for('static', filename='assets/images/banner-01.jpg') }}">
          </div>

          <div class="slide zoomFade">
            <img src="{{ url_for('static', filename='assets/images/banner-02.jpg') }}">
          </div>

          <div class="slide zoomFade">
            <img src="{{ url_for('static', filename='assets/images/banner-03a.jpg') }}">
          </div>

          <div class="slide zoomFade">
            <img src="{{ url_for('static', filename='assets/images/banner-04.jpg') }}">
          </div>
        </div>
      </div>      

    </div>

{% endblock %}


{% block css %}

  <!-- LOGIN STYLESHEETS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/account_actions/css/login.css') }}">

  <!-- BACKGROUND SLIDES STYLESHEETS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/account_actions/css/slides_animation.css') }}">

{% endblock %}


{% block js %}   

  <!-- BACKGROUND SLIDES JAVASCRIPT FUNCTIONS -->
  <script src="{{ url_for('static', filename='assets/account_actions/js/slides_animation.js') }}"></script>

{% endblock%}
